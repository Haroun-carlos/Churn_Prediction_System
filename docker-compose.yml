version: '3.8'

services:
  churn_api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models
    environment:
      - MODEL_PATH=/app/models/churn_model.joblib
      - PREPROCESSOR_PATH=/app/models/preprocessor.joblib
    restart: always
